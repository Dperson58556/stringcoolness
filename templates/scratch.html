  <body>

    <h1>String Scorer</h1>

    <div>
      <label>
        Length:
        <input id="length" type="number" value="10">
      </label>
      <label>
        Roll Count:
        <input id="roll_count" type="number" value="25">
      </label>
      <button onclick="generate()">Generate</button>
    </div>

        test_string:
        <input id="test_string" type="text" value="teststring">

    <script> 
      async function generate() {
        const length = document.getElementById("length").value;
        const roll_count = document.getElementById("roll_count").value;
        const res = await fetch(`/generate?length=${length}&roll_count=${roll_count}`);
        const data = await res.json();

        const obj = data;

        const results = document.getElementById("results");
        results.innerHTML = "";

        results.appendChild(createCards(obj));
      }

      async function generate_test_string() {
        const test_string = document.getElementById("test_string").value;
        const res = await fetch(`/generate_test_string?test_string=${test_string}`);
        const data = await res.json();
        
        const obj = data;

        const results = document.getElementById("results");
        results.innerHTML = "";

        results.appendChild(createCards(obj));
      }

      function createCards(data) {
        const dataArray = Array.isArray(data) ? data : [data];
        console.log(data);

        const container = document.createElement("div");
        container.className = "card-container";

        dataArray.forEach(item => {
          container.appendChild(createCard(item));
        });
        return container;
      }

      function setRarity(value, max = 10) {
        const percent = Math.min(value / max, 1) * 100;
        const bar = document.getElementById("rarity-bar");

        bar.style.width = zToPercent(vowelZScore) + "%";

        if (percent < 30) bar.style.background = "#888";
        else if (percent < 60) bar.style.background = "#4caf50";
        else if (percent < 85) bar.style.background = "#ff9800";
        else bar.style.background = "#e91e63";
      }

      function makeStat(name, value) {
        if (name == "% UNIQUE"){
          value = value * 100.00
        };

        const row = document.createElement("div");
        row.className = "stat";

        const label = document.createElement("div");
        label.className = "stat-name";
        label.textContent = name;

        const val = document.createElement("div");
        val.className = "stat-value";
        if (name == "% UNIQUE") {
          val.textContent = `${value}%`;
        } else 
        { val.textContent = value; };

        row.appendChild(label);
        row.appendChild(val);
        return row;
      }

      function makeStatBar(name, value, pct) {
        let colors = {
          0: "rgb(227, 0, 0)",
          1: "rgb(227, 0, 0)",
          2: "rgb(227, 0, 0)",
          3: "rgb(240, 100, 0)",
          4: "rgb(255, 195, 0)",
          5: "rgb(255, 195, 0)",
          6: "rgb(240, 240, 0)",
          7: "rgb(240, 240, 0)",
          8: "rgb(0, 230, 0)",
          9: "rgb(0, 230, 0)",
          10: "rgb(201, 255, 255)"
        }

        const row = document.createElement("div");
        row.className = "stat stat-rarity";

        const label = document.createElement("div");
        label.className = "stat-name";
        label.textContent = name;

        const meter = document.createElement("div");
        meter.className = "rarity-meter";

        const fill = document.createElement("div");
        fill.className = "rarity-fill";
        fill.style.background = colors[Math.min(Math.round(pct/10))] || "rgb(201, 255, 255)";
        fill.style.width = Math.max(pct,0.5) + "%";

        // optional: show the value as text (tooltip or inline)
        fill.title = value;

        meter.appendChild(fill);
        row.appendChild(label);
        row.appendChild(meter);

        return row;
      }
  
      function makeHighlightedString(container, fullString, word, wordStart) {
        const wordStyleByLength = {
          3:  { color: "rgb(91, 196, 88)", glow: "0 0 6px rgba(91, 196, 88, 0.5)" },
          4:  { color: "rgb(70, 179, 255)", glow: "0 0 6px rgba(70, 179, 255, 0.6)" },
          5:  { color: "rgb(220, 100, 255)", glow: "0 0 8px rgba(220, 100, 255, 0.7)" },
          6:  { color: "rgb(255, 170, 0)", glow: "0 0 10px rgba(255, 170, 0, 0.8)" },
          7:  { color: "rgb(255, 255, 26)", glow: "0 0 10px rgba(255, 255, 26, 0.9)" },
          8:  { color: "rgb(255, 0, 34)", glow: "0 0 10px rgba(255, 0, 34, 1.0)" },
          9:  { color: "rgb(255, 169, 213)", glow: "0 0 10px rgba(255, 169, 213, 1.0)" },
          10: { color: "rgb(173, 251, 255)", glow: "0 0 10px rgba(173, 251, 255, 1.0)" },
        };
        container.textContent = ""; // clear existing

        const before = fullString.slice(0, wordStart);
        const target = fullString.slice(wordStart, wordStart + word.length);
        const after  = fullString.slice(wordStart + word.length);

        container.appendChild(document.createTextNode(before));

        const span = document.createElement("span");
        span.className = "highlight";

        const style = wordStyleByLength[Math.min(10,word.length)];
        if (style) {
          span.style.color = style.color;
          span.style.textShadow = style.glow;
        }

        span.textContent = target;
        container.appendChild(span);
        container.appendChild(document.createTextNode(after));
      }

      function createCard(data) {
        const card = document.createElement("div");
        let card_rarities = {
          "Common":"card",
          "Uncommon":"cardunc",
          "Rare":"cardrar",
          "Epic":"cardepc",
          "Legendary":"cardleg",
          "Mythical":"cardmyth"
        }
        card.className = card_rarities[data.card_rarity];

        ////////////////////////// Header//////////////////////////
        const header = document.createElement("div");
        header.className = "card-header";

        const title = document.createElement("div");
        title.className = "card-title";
        title.textContent = data.random_string.length;

        const score = document.createElement("div");
        score.className = "card-score";
        score.textContent = data.total_points.toLocaleString('en-US');

        header.appendChild(title);
        header.appendChild(score);

        ////////////////////////// String Display//////////////////////////
        // const stringDisplay = document.createElement("div");
        // stringDisplay.className = "string-display";
        // stringDisplay.textContent = data.random_string;

        const stringDisplay = document.createElement("div");
        stringDisplay.className = "string-display";

        if (data.words_within[0]) {
          makeHighlightedString(
            stringDisplay,
            data.random_string,
            data.words_within[0][2],
            data.words_within[0][0]
          )
        } else {
          stringDisplay.textContent = data.random_string;
        };

        ////////////////////////// Stats//////////////////////////
        const statsTitleHolder = document.createElement("div");
        statsTitleHolder.className = "subsection";

        const statsTitle = document.createElement("div");
        statsTitle.className = "subsection-title";
        statsTitle.textContent = "Statistics";

        statsTitleHolder.appendChild(statsTitle);

        const stats = document.createElement("div");
        stats.className = "stats";

        stats.appendChild(makeStat("LENGTH", data.random_string.length));
        stats.appendChild(makeStat("% UNIQUE", data.percent_unique));
        stats.appendChild(makeStat("ENTROPY", data.entropy));
        stats.appendChild(makeStatBar("ENTROPY RARITY", data.entropy_rarity, data.entropy_bar_percent));
        stats.appendChild(makeStatBar("VOWEL RATIO RARITY", data.vowel_ratio_rarity, data.vowel_ratio_bar_percent));
        
        if (data.bookend != null){
          stats.appendChild(makeStat("BOOKEND", data.bookend[0]));
        } else {
          stats.appendChild(makeStat("BOOKEND", 0));
        }
        stats.appendChild(makeStat("BIGRAM SCORE", data.bigram_bonus));

        ////////////////////////// Repeated Characters//////////////////////////
        const repeatsCharSection = document.createElement("div");
        repeatsCharSection.className = "subsection";

        const repeatsCharTitle = document.createElement("div");
        repeatsCharTitle.className = "subsection-title";
        repeatsCharTitle.textContent = "Repeated Characters";

        repeatsCharSection.appendChild(repeatsCharTitle);

        const letters = "abcdefghijklmnopqrstuvwxyz";
        const repeats = data.repeated_1_strs ?? {};

        letters.split("").forEach(letter => {
          const pill = document.createElement("span");
          const color_threshold = 9
          if (repeats[letter]) {
            pill.className = `pill${Math.min(color_threshold, repeats[letter])}`;
            if (repeats[letter] < 10) {
              if (repeats[letter] != 1) { 
                pill.textContent = `${letter} × ${repeats[letter]}`; 
              } else { pill.textContent = `${letter}`; }
            } else {
              pill.textContent = `${letter} ×${repeats[letter]}`;
            }
          } else {
            pill.className = "pill0";
            pill.textContent = letter;
          }

          repeatsCharSection.appendChild(pill);
        });

        ////////////////////////// Repeated Chunks//////////////////////////
        const repeatsSection = document.createElement("div");
        repeatsSection.className = "subsection";

        const repeatsTitle = document.createElement("div");
        repeatsTitle.className = "subsection-title";
        repeatsTitle.textContent = "Repeated Chunks";

        repeatsSection.appendChild(repeatsTitle);

        if (data.repeated_chunks && Object.keys(data.repeated_chunks).length > 0) {
          Object.keys(data.repeated_chunks).forEach(key => {
            const r = {
              substr: key,
              count: data.repeated_chunks[key]
            };
            const pill = document.createElement("span");
            const color_threshold = 9
            pill.className = `pill${Math.min(color_threshold, r.substr.length)}`;
            pill.textContent = `${r.substr} ×${r.count}`;
            repeatsSection.appendChild(pill);
          });
        }
        else {
          const none = document.createElement("div");
          none.className = "pill0";
          none.textContent = "-";
          repeatsSection.appendChild(none);
        }

        ////////////////////////// Character Blocks//////////////////////////
        const blocksSection = document.createElement("div");
        blocksSection.className = "subsection";

        const blocksTitle = document.createElement("div");
        blocksTitle.className = "subsection-title";
        blocksTitle.textContent = "Character Blocks";

        blocksSection.appendChild(blocksTitle);

        if (data.char_blocks_dict && Object.keys(data.char_blocks_dict).length > 0) {
          Object.keys(data.char_blocks_dict).forEach(key => {
            const r = {
              substr: key,
              count: data.char_blocks_dict[key]
            };
            const pill = document.createElement("span");
            const color_threshold = 9
            pill.className = `pill${Math.min(color_threshold, r.substr.length)}`;
            pill.textContent = `${r.substr} ×${r.count}`;
            blocksSection.appendChild(pill);
          });
        }
        else {
          const none = document.createElement("div");
          none.className = "pill0";
          none.textContent = "-";
          blocksSection.appendChild(none);
        }

        ////////////////////////// Palindromic Blocks//////////////////////////
        const palindromesSection = document.createElement("div");
        palindromesSection.className = "subsection";

        const palindromesTitle = document.createElement("div");
        palindromesTitle.className = "subsection-title";
        palindromesTitle.textContent = "Palindromes Within";

        palindromesSection.appendChild(palindromesTitle);

        if (data.palindromes && data.palindromes.length > 0) {
          data.palindromes.forEach(key => {
            const r = {
              substr: key[2],
              word_len: key[2].length
            };
            const pill = document.createElement("span");
            const color_threshold = 9
            pill.className = `pill${Math.min(color_threshold, r.word_len - 1)}`;
            pill.textContent = `${r.substr}`;
            palindromesSection.appendChild(pill);
          });
        }
        else {
          const none = document.createElement("div");
          none.className = "pill0";
          none.textContent = "-";
          palindromesSection.appendChild(none);
        }

                ////////////////////////// Words Within//////////////////////////
        const wordsWithinSection = document.createElement("div");
        wordsWithinSection.className = "subsection";

        const wordsWithinTitle = document.createElement("div");
        wordsWithinTitle.className = "subsection-title";
        wordsWithinTitle.textContent = "Words Within";

        wordsWithinSection.appendChild(wordsWithinTitle);

        if (data.words_within && data.words_within.length > 0) {
          data.words_within.forEach(key => {
            const r = {
              substr: key[2],
              word_len: key[2].length
            };
            const pill = document.createElement("span");
            const color_threshold = 9
            pill.className = `pill${Math.min(color_threshold, r.word_len - 1)}`;
            pill.textContent = `${r.substr}`;
            wordsWithinSection.appendChild(pill);
          });
        }
        else {
          const none = document.createElement("div");
          none.className = "pill0";
          none.textContent = "-";
          wordsWithinSection.appendChild(none);
        }

        ////////////////////////// Assemble Card//////////////////////////
        card.appendChild(header);
        card.appendChild(stringDisplay);
        card.appendChild(statsTitleHolder);
        card.appendChild(stats);
        card.appendChild(repeatsCharSection);
        card.appendChild(repeatsSection);
        card.appendChild(blocksSection);
        card.appendChild(palindromesSection);
        card.appendChild(wordsWithinSection);
        
        return card;
      }
    </script>
